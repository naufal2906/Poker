<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Poker Engine</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-slot: #334155;
      --primary: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    h2 { text-align: center; font-size: 1.1rem; letter-spacing: 1px; color: var(--primary); margin-bottom: 4px; }
    .section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); letter-spacing: 0.5px; margin-bottom: 6px; }

    .mode-selector { display: flex; justify-content: center; }
    .mode-btn { background: var(--bg-card); color: var(--primary); border: 1px solid var(--primary); padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

    .opponents-selector { background: var(--bg-card); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .opp-btn { background: var(--bg-slot); color: #fff; border: none; width: 28px; height: 28px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }

    .card-group { display: flex; gap: 8px; }
    .card-slot { flex: 1; height: 48px; background: var(--bg-card); border: 1px dashed var(--bg-slot); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; position: relative; user-select: none; }
    .card-slot.filled { border: 1px solid var(--primary); background: #ffffff; font-size: 1.1rem; font-weight: 800; }
    .card-slot.filled.red { color: #dc2626; }
    .card-slot.filled.black { color: #0f172a; }
    .remove-btn { position: absolute; top: 2px; right: 4px; background: transparent; border: none; color: #64748b; font-size: 14px; cursor: pointer; }

    .preset-buttons { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .preset-btn { flex: 1; padding: 6px 8px; background: var(--bg-card); border: 1px solid var(--bg-slot); color: var(--text-sub); border-radius: 6px; font-size: 0.75rem; white-space: nowrap; cursor: pointer; }
    .preset-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

    /* Matrix Styles dengan Warna GTO */
    .range-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; background: var(--bg-card); padding: 4px; border-radius: 8px; }
    .range-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; border-radius: 2px; cursor: pointer; color: #ffffff; user-select: none; }
    
    /* Warna GTO Action */
    .range-cell.gto-raise { background-color: #ef4444 !important; } /* Merah */
    .range-cell.gto-call { background-color: #10b981 !important; }  /* Hijau */
    .range-cell.gto-fold { background-color: #3b82f6 !important; }  /* Biru */
    
    .range-cell.hero-highlight { border: 2px solid #f59e0b !important; box-shadow: 0 0 8px #f59e0b; transform: scale(1.1); z-index: 10; }

    /* Legend GTO Bar */
    .gto-legend { display: flex; border-radius: 6px; overflow: hidden; font-size: 0.75rem; font-weight: bold; text-align: center; margin-top: 6px; }
    .gto-legend-item { flex: 1; padding: 6px 0; color: #fff; }
    .gto-legend-item.fold { background: #3b82f6; }
    .gto-legend-item.call { background: #10b981; }
    .gto-legend-item.raise { background: #ef4444; }

    .equity-box { background: var(--bg-card); padding: 12px; border-radius: 8px; display: flex; justify-content: space-around; text-align: center; }
    .equity-item span { display: block; font-size: 0.7rem; color: var(--text-sub); }
    .equity-item strong { font-size: 1.2rem; }

    .btn-calc { background: var(--green); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; width: 100%; }
    .btn-reset { background: transparent; border: 1px solid var(--bg-slot); color: var(--text-sub); padding: 8px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; width: 100%; }

    .picker-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .picker-overlay.active { display: flex; }
    .picker-box { background: var(--bg-main); padding: 16px; border-radius: 12px; width: 100%; max-width: 400px; }
    .picker-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
    .card-option { aspect-ratio: 0.75; background: #ffffff; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; cursor: pointer; }
    .card-option.red { color: #dc2626; }
    .card-option.black { color: #0f172a; }
    .card-option.disabled { opacity: 0.2; pointer-events: none; background: #64748b; }

    .combo-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .combo-stat-item { background: var(--bg-card); padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="app">
    <h2>PRO POKER ENGINE</h2>

    <div class="mode-selector">
      <button class="mode-btn active" id="btn-hvr">Hand vs Range GTO</button>
    </div>

    <div class="opponents-selector">
      <span class="section-title" style="margin:0;">LAWAN AKTIF DALAM HAND</span>
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="opp-btn" id="btn-opp-minus">-</button>
        <span id="opp-count" style="font-weight:bold; font-size:14px;">8 Lawan (9 Max Table)</span>
        <button class="opp-btn" id="btn-opp-plus">+</button>
      </div>
    </div>

    <div class="section-title">KARTU KAMU (HERO)</div>
    <div class="card-group">
      <div class="card-slot empty" id="hero-0">+ Pilih</div>
      <div class="card-slot empty" id="hero-1">+ Pilih</div>
    </div>

    <div class="section-title" style="margin-top:15px;">PRESET RANGE / GTO MATRIX</div>
    <div class="preset-buttons">
      <button class="preset-btn" id="btn-p5">Top 5%</button>
      <button class="preset-btn" id="btn-p10">Top 10%</button>
      <button class="preset-btn" id="btn-p20">Top 20%</button>
      <button class="preset-btn" id="btn-p50">Top 50%</button>
      <button class="preset-btn active" id="btn-p100">100% (GTO Map)</button>
    </div>

    <!-- Matrix Range Grid -->
    <div id="range-grid" class="range-grid"></div>

    <!-- Legend Warna GTO -->
    <div class="gto-legend">
      <div class="gto-legend-item fold">Blue = Fold</div>
      <div class="gto-legend-item call">Green = Call</div>
      <div class="gto-legend-item raise">Red = Raise</div>
    </div>

    <div class="section-title" style="margin-top:15px;">KARTU KOMUNITAS (BOARD)</div>
    <div class="card-group">
      <div class="card-slot empty" id="board-0">Flop 1</div>
      <div class="card-slot empty" id="board-1">Flop 2</div>
      <div class="card-slot empty" id="board-2">Flop 3</div>
      <div class="card-slot empty" id="board-3">Turn</div>
      <div class="card-slot empty" id="board-4">River</div>
    </div>

    <div class="equity-box">
      <div class="equity-item">
        <span>Menang Kamu</span>
        <strong id="hero-equity" style="color:var(--green, #10b981);">0.0%</strong>
      </div>
      <div class="equity-item">
        <span>Seri / Split</span>
        <strong id="tie-equity" style="color:var(--yellow, #f59e0b);">0.0%</strong>
      </div>
      <div class="equity-item">
        <span>Menang Lawan</span>
        <strong id="villain-equity" style="color:var(--red, #ef4444);">0.0%</strong>
      </div>
    </div>

    <button class="btn-calc" id="btn-run-sim">HITUNG SIMULASI MONTE CARLO</button>
    <button class="btn-reset" id="btn-reset-all">Reset Semua Kartu</button>

    <div id="possible-combos-box" style="margin-top:15px;"></div>
    <div id="villain-combos-box" style="margin-top:15px;"></div>
  </div>

  <div class="picker-overlay" id="card-picker-modal">
    <div class="picker-box">
      <div class="section-title">PILIH KARTU</div>
      <div id="picker-cards-grid" class="picker-grid"></div>
      <button class="btn-reset" id="btn-close-picker" style="margin-top:15px; width:100%;">Tutup</button>
    </div>
  </div>

  <script src="evaluator.js"></script>
  <script src="app.js"></script>
</body>
</html>
